name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows / Node 26.3.1
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/mvs_ci
      REDIS_URL: redis://127.0.0.1:1
      BETTER_AUTH_SECRET: ci-only-placeholder-not-a-production-secret
      BETTER_AUTH_URL: http://localhost:3000
      AI_SECRET: ci-only-placeholder-not-a-production-secret
      AI_URL: http://127.0.0.1:1
      MVS_RUN_INTEGRATION: 'false'
      MVS_INTEGRATION_GPU: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.3.1'
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma and build applications
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Check architecture
        run: pnpm check:architecture
      - name: Unit tests
        run: pnpm test
      - name: Verify publication contract
        run: pnpm contract:verify
